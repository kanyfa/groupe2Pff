<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">
                            <i class="fas fa-user-plus me-2"></i>Créer une nouvelle personne
                        </h4>
                        <button class="btn btn-light btn-sm" (click)="onCancel()">
                            <i class="fas fa-arrow-left me-1"></i>Retour
                        </button>
                    </div>
                </div>

                <div class="card-body">
                    <form [formGroup]="personneForm" (ngSubmit)="onSubmit()">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label">Prénom *</label>
                                <input type="text" class="form-control" id="firstName" formControlName="firstName"
                                    [class.is-invalid]="personneForm.get('firstName')?.invalid && personneForm.get('firstName')?.touched">
                                <div class="invalid-feedback"
                                    *ngIf="personneForm.get('firstName')?.invalid && personneForm.get('firstName')?.touched">
                                    Le prénom est requis
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label">Nom *</label>
                                <input type="text" class="form-control" id="lastName" formControlName="lastName"
                                    [class.is-invalid]="personneForm.get('lastName')?.invalid && personneForm.get('lastName')?.touched">
                                <div class="invalid-feedback"
                                    *ngIf="personneForm.get('lastName')?.invalid && personneForm.get('lastName')?.touched">
                                    Le nom est requis
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" formControlName="email"
                                    [class.is-invalid]="personneForm.get('email')?.invalid && personneForm.get('email')?.touched">
                                <div class="invalid-feedback"
                                    *ngIf="personneForm.get('email')?.invalid && personneForm.get('email')?.touched">
                                    <span *ngIf="personneForm.get('email')?.errors?.['required']">L'email est
                                        requis</span>
                                    <span *ngIf="personneForm.get('email')?.errors?.['email']">Format d'email
                                        invalide</span>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Téléphone *</label>
                                <input type="tel" class="form-control" id="phone" formControlName="phone"
                                    [class.is-invalid]="personneForm.get('phone')?.invalid && personneForm.get('phone')?.touched">
                                <div class="invalid-feedback"
                                    *ngIf="personneForm.get('phone')?.invalid && personneForm.get('phone')?.touched">
                                    Le téléphone est requis
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Adresse *</label>
                            <textarea class="form-control" id="address" rows="3" formControlName="address"
                                [class.is-invalid]="personneForm.get('address')?.invalid && personneForm.get('address')?.touched">
              </textarea>
                            <div class="invalid-feedback"
                                *ngIf="personneForm.get('address')?.invalid && personneForm.get('address')?.touched">
                                L'adresse est requise
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="city" class="form-label">Ville *</label>
                                <input type="text" class="form-control" id="city" formControlName="city"
                                    [class.is-invalid]="personneForm.get('city')?.invalid && personneForm.get('city')?.touched">
                                <div class="invalid-feedback"
                                    *ngIf="personneForm.get('city')?.invalid && personneForm.get('city')?.touched">
                                    La ville est requise
                                </div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="postalCode" class="form-label">Code postal *</label>
                                <input type="text" class="form-control" id="postalCode" formControlName="postalCode"
                                    [class.is-invalid]="personneForm.get('postalCode')?.invalid && personneForm.get('postalCode')?.touched">
                                <div class="invalid-feedback"
                                    *ngIf="personneForm.get('postalCode')?.invalid && personneForm.get('postalCode')?.touched">
                                    Le code postal est requis
                                </div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="country" class="form-label">Pays *</label>
                                <input type="text" class="form-control" id="country" formControlName="country"
                                    [class.is-invalid]="personneForm.get('country')?.invalid && personneForm.get('country')?.touched">
                                <div class="invalid-feedback"
                                    *ngIf="personneForm.get('country')?.invalid && personneForm.get('country')?.touched">
                                    Le pays est requis
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-secondary" (click)="onCancel()">
                                <i class="fas fa-times me-2"></i>Annuler
                            </button>
                            <button type="submit" class="btn btn-primary"
                                [disabled]="personneForm.invalid || isSubmitting">
                                <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
                                <i class="fas fa-save me-2"></i>
                                {{ isSubmitting ? 'Création...' : 'Créer la personne' }}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
