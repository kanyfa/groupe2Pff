<div class="container py-5">
  <div class="row">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary mb-0">
          <i class="fas fa-bell me-2"></i>
          Notifications
          <span class="badge bg-danger ms-2" *ngIf="getUnreadCount() > 0">{{ getUnreadCount() }}</span>
        </h2>
        <button 
          class="btn btn-outline-primary"
          (click)="markAllAsRead()"
          *ngIf="getUnreadCount() > 0">
          <i class="fas fa-check-double me-2"></i>Tout marquer comme lu
        </button>
      </div>

      <!-- Loading -->
      <div class="text-center py-5" *ngIf="isLoading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Chargement...</span>
        </div>
        <p class="mt-3 text-muted">Chargement des notifications...</p>
      </div>

      <!-- Liste des notifications -->
      <div class="notifications-list" *ngIf="!isLoading">
        <div 
          class="notification-item"
          *ngFor="let notification of notifications"
          [class.unread]="!notification.isRead">
          
          <div class="notification-icon">
            <i [class]="notification.icon + ' ' + notification.color"></i>
          </div>
          
          <div class="notification-content">
            <div class="notification-header">
              <h6 class="notification-title mb-1">{{ notification.title }}</h6>
              <small class="text-muted">{{ formatDate(notification.date) }}</small>
            </div>
            
            <p class="notification-text mb-2">{{ notification.content }}</p>
            
            <div class="notification-actions">
              <button 
                class="btn btn-sm btn-outline-primary"
                *ngIf="!notification.isRead"
                (click)="markAsRead(notification)">
                <i class="fas fa-check me-1"></i>Marquer comme lu
              </button>
              
              <button 
                class="btn btn-sm btn-outline-danger ms-2"
                (click)="deleteNotification(notification.id)">
                <i class="fas fa-trash me-1"></i>Supprimer
              </button>
            </div>
          </div>
        </div>

        <!-- Message si aucune notification -->
        <div class="text-center py-5" *ngIf="notifications.length === 0">
          <i class="fas fa-bell-slash fa-3x text-muted mb-3"></i>
          <h4 class="text-muted">Aucune notification</h4>
          <p class="text-muted">Vous n'avez pas encore de notifications.</p>
        </div>
      </div>

      <!-- Paramètres de notification -->
      <div class="card border-0 shadow-sm mt-5">
        <div class="card-header bg-light">
          <h5 class="mb-0 text-primary">
            <i class="fas fa-cog me-2"></i>Paramètres de notification
          </h5>
        </div>
        
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="emailNotifications" checked>
                <label class="form-check-label" for="emailNotifications">
                  Notifications par email
                </label>
              </div>
              
              <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="newMessages" checked>
                <label class="form-check-label" for="newMessages">
                  Nouveaux messages
                </label>
              </div>
            </div>
            
            <div class="col-md-6">
              <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="documentFound" checked>
                <label class="form-check-label" for="documentFound">
                  Document potentiellement trouvé
                </label>
              </div>
              
              <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="announcementUpdates">
                <label class="form-check-label" for="announcementUpdates">
                  Mises à jour d'annonces
                </label>
              </div>
            </div>
          </div>
          
          <div class="d-flex justify-content-end">
            <button class="btn btn-primary">
              <i class="fas fa-save me-2"></i>Sauvegarder les paramètres
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
